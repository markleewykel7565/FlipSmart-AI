services:
  - type: web
    name: flipsmart-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: FREE_ANALYSES_PER_DAY
        value: 3
